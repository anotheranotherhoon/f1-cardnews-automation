<!-- calendar: 시즌 캘린더 · 라운드별 우승자 (2열 × 최대 12행) — 월 총정리 마지막 카드
     {{CSS}} {{KICKER}} {{TITLE}} {{SUBTITLE}} {{LEFT_ROWS_HTML}} {{RIGHT_ROWS_HTML}} {{NOTE}} {{DATE}}
     행: <div class="cal-row now t-mercedes">
           <div class="cal-flag"><img src="data:image/png;base64,..."></div>
           <div class="cal-main"><div class="cal-gp">Italian</div><div class="cal-date"><span class="cal-rnd">R13</span>9월 6일</div></div>
           <div class="cal-bar"></div><div class="cal-win">Kimi Antonelli</div>
         </div>
     세 열(국기 · 그랑프리 정보 · 우승자)의 폭은 모든 행에서 같다. 국기는 고정 슬롯(84×56) 안에
     object-fit: contain 으로 원본 비율 그대로 넣는다 — 크롭·늘리기·클리핑 없음 (1원칙).
     미개최 라운드는 .todo 로 흐리게, 우승자 칸은 비운다 -->
<meta charset="utf-8">
<style>
{{CSS}}
.cal { flex: 1; display: flex; gap: 20px; margin-top: 38px; }
.calcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.cal-row { display: flex; align-items: center; height: 68px; background: rgba(255,255,255,0.055);
           border-radius: 12px; overflow: hidden; padding: 0 12px 0 10px; gap: 12px; }
.cal-row.now { background: rgba(225,6,0,0.22); outline: 2px solid rgba(225,6,0,0.55); }
.cal-row.todo { opacity: 0.5; }
.cal-flag { flex: none; width: 84px; height: 56px; display: flex; align-items: center; justify-content: center; }
.cal-flag img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.cal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.cal-gp { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-rnd { font-weight: 900; font-style: italic; color: #b9b9c6; margin-right: 7px; }
.cal-date { font-size: 17px; color: #9a9aa8; font-variant-numeric: tabular-nums; }
.cal-bar { width: 6px; height: 40px; border-radius: 4px; background: var(--team, transparent); flex: none; }
.cal-win { flex: none; width: 160px; font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<div class="bg-dim"></div>
<div class="frame">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="cal">
    <div class="calcol">{{LEFT_ROWS_HTML}}</div>
    <div class="calcol">{{RIGHT_ROWS_HTML}}</div>
  </div>
  <div class="footer">
    <div class="brand">hooni<span>.speed</span></div>
    <div class="note">{{NOTE_LINE}}</div>
  </div>
</div>
